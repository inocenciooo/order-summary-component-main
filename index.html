<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./src/images/favicon-32x32.png">
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="stylesheet" href="./src/css/responsive.css">

  <title>Order summary card | Vinícius Inocêncio</title>

</head>

<body>
  <main class="card">
    <div class="image">
      <img src="./src/images/illustration-hero.svg">
    </div>
    <section>
      <div class="summary">
        <h1>Order Summary</h1>
        <p>You can now listen to millions of songs, audiobooks, and podcasts on any
          device anywhere you like!</p>
      </div>
      <div class="plan">
        <div class="annual-plan">
          <h4>Annual Plan</h4>
          <p>$59.99/year</p>
        </div>
        <div class="change">
          <p><a href="#">Change</a></p>
        </div>
      </div>
      <div class="buttons">
        <button class="proced">
          Proceed to Payment
        </button>
        <button class="cancel">
          Cancel Order
        </button>
      </div>
    </section>
  </main>

</body>

</html>
